<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福大失物招领 - 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <!-- ============ 启动页（水彩校园背景，2.4s 后进入登录页） ============ -->
  <div id="splashView" class="gate-view splash-view" hidden>
    <img class="splash-bg" src="img/campus-watercolor.jpg" alt="福大校园水彩全景">
    <div class="splash-mask"></div>
    <div class="splash-content">
      <div class="splash-logo">🏫</div>
      <div class="splash-title">福大失物招领</div>
      <div class="splash-subtitle">让每一件失物都能回家</div>
      <div class="splash-bar"><div class="bar-inner"></div></div>
      <div class="splash-skip" id="splashSkip">点击任意处跳过</div>
    </div>
    <div class="splash-footer">福州大学 · 软件工程结对作业</div>
  </div>

  <!-- ============ 登录页 ============ -->
  <div id="loginView" class="gate-view login-view" hidden>
    <div class="login-hero">
      <img class="login-bg" src="img/campus-watercolor.jpg" alt="">
      <div class="login-hero-mask"></div>
      <div class="login-hero-text">
        <div class="login-logo">🏫</div>
        <div class="login-app-name">福大失物招领</div>
        <div class="login-slogan">让每一件失物都能回家</div>
      </div>
    </div>

    <div class="login-panel">
      <h2 class="login-title">欢迎回来 👋</h2>
      <p class="login-tip">登录后可发布寻物 / 招领信息，还能收藏感兴趣的帖子</p>

      <form id="loginForm" novalidate>
        <div class="form-group" id="accountGroup">
          <label for="accountInput">学号 / 手机号</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input id="accountInput" class="form-control" type="text" inputmode="numeric"
                   placeholder="请输入学号或手机号" autocomplete="username" maxlength="12">
          </div>
          <p class="error-text">请输入 8-12 位学号或 11 位手机号</p>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="passwordInput">密码</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input id="passwordInput" class="form-control" type="password"
                   placeholder="请输入密码（至少 6 位）" autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示或隐藏密码">👁</button>
          </div>
          <p class="error-text">密码至少 6 位</p>
        </div>

        <div class="login-row">
          <span></span>
          <button type="button" class="link-btn" id="forgotBtn">忘记密码？</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block login-btn">登 录</button>
      </form>

      <div class="login-links">
        <button type="button" class="link-btn guest-btn" id="guestBtn">游客模式，先逛逛 →</button>
      </div>

      <p class="login-agreement">登录即代表同意《用户协议》与《隐私政策》 · 课程演示无真实后端，任意符合格式的账号均可登录</p>
    </div>
  </div>

  <div class="app">
    <!-- 顶部：标题 + 搜索栏 -->
    <header class="app-header">
      <h1>福大失物招领<span class="subtitle">让每一件失物都能回家</span></h1>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索物品名称 / 描述 / 地点 / 类别"
               aria-label="搜索失物招领信息">
      </div>
    </header>

    <!-- 类型 Tab + 类别筛选 -->
    <div class="toolbar">
      <div class="type-tabs" role="tablist">
        <button class="type-tab active" data-type="all" type="button">全部</button>
        <button class="type-tab" data-type="lost" type="button">寻物</button>
        <button class="type-tab" data-type="found" type="button">招领</button>
      </div>
      <div class="filter-row">
        <label for="categoryFilter">类别</label>
        <select id="categoryFilter" aria-label="按类别筛选">
          <option value="all">全部类别</option>
        </select>
      </div>
    </div>

    <!-- 信息列表 -->
    <main>
      <section id="itemList" class="list" aria-live="polite"></section>

      <!-- 空状态 -->
      <section id="emptyState" class="empty" hidden>
        <span class="empty-icon">🔎</span>
        <span class="empty-text">没有找到相关信息</span>
        <a class="btn btn-primary" href="publish.html" style="display:inline-flex;">📢 我要发布一条</a>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <a class="nav-item" data-nav="index" href="index.html">
        <span class="nav-icon">🏠</span><span>首页</span>
      </a>
      <a class="nav-item nav-publish" data-nav="publish" href="publish.html">
        <span class="nav-icon">➕</span><span>发布</span>
      </a>
      <a class="nav-item" data-nav="profile" href="profile.html">
        <span class="nav-icon">👤</span><span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
