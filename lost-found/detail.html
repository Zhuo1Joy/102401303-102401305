<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福大失物招领 - 信息详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="detail">
  <div class="app">
    <header class="page-header">
      <a class="back-btn" href="javascript:history.back()" aria-label="返回上一页">‹</a>
      <h2>信息详情</h2>
      <span class="header-placeholder"></span>
    </header>

    <main>
      <!-- 正常内容容器 -->
      <div id="detailWrap" class="detail" hidden>
        <!-- 标题区 -->
        <section class="detail-hero">
          <div class="hero-top">
            <span id="dTypeBadge" class="badge"></span>
            <span id="dStatus" class="status"></span>
          </div>
          <h2 id="dTitle"></h2>
          <p class="publish-time">发布时间：<span id="dCreatedAt"></span></p>
        </section>

        <!-- 基础信息 -->
        <section class="info-panel">
          <div class="info-row">
            <span class="info-label">物品类别</span>
            <span class="info-value" id="dCategory"></span>
          </div>
          <div class="info-row">
            <span class="info-label" id="dPlaceLabel">丢失地点</span>
            <span class="info-value" id="dLocation"></span>
          </div>
          <div class="info-row">
            <span class="info-label" id="dTimeLabel">丢失时间</span>
            <span class="info-value" id="dTime"></span>
          </div>
          <div class="info-row">
            <span class="info-label">发布者</span>
            <span class="info-value" id="dPublisher"></span>
          </div>
        </section>

        <!-- 描述 -->
        <section class="info-panel">
          <p class="panel-title">📝 物品描述</p>
          <p class="panel-content" id="dDescription"></p>
        </section>

        <!-- 联系方式 -->
        <section class="info-panel">
          <p class="panel-title">📞 联系方式</p>
          <div class="info-row">
            <div class="contact-value">
              <span class="contact-text" id="dContact"></span>
              <button type="button" class="btn btn-primary btn-copy" id="copyBtn">复制</button>
            </div>
          </div>
        </section>

        <!-- 状态操作（仅进行中显示） -->
        <div class="detail-actions" id="doneActionWrap">
          <button type="button" class="btn btn-primary btn-block" id="markDoneBtn"></button>
        </div>
      </div>

      <!-- 信息不存在 / 链接异常 -->
      <div id="notFound" class="not-found" hidden>
        <span class="empty-icon" style="font-size:52px;">😵</span>
        <p style="margin:12px 0 18px;color:var(--text-sub);">这条信息不存在或已被删除</p>
        <a class="btn btn-primary" href="index.html" style="display:inline-flex;">返回首页</a>
      </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <a class="nav-item" data-nav="index" href="index.html">
        <span class="nav-icon">🏠</span><span>首页</span>
      </a>
      <a class="nav-item nav-publish" data-nav="publish" href="publish.html">
        <span class="nav-icon">➕</span><span>发布</span>
      </a>
      <a class="nav-item" data-nav="mine" href="mine.html">
        <span class="nav-icon">👤</span><span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
