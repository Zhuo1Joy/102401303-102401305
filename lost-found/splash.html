<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福大失物招领</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 启动页全屏红色背景，与整体红色基调一致 */
    .splash {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(160deg, #e53935 0%, #c62828 55%, #b71c1c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .splash::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      top: -120px;
      right: -120px;
    }
    .splash::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      bottom: -80px;
      left: -80px;
    }
    .splash-logo {
      font-size: 86px;
      margin-bottom: 18px;
      animation: floatY 2.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.2));
      z-index: 1;
    }
    .splash-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      z-index: 1;
    }
    .splash-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 56px;
      z-index: 1;
    }
    .splash-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 30px;
      z-index: 1;
    }
    .splash-bar .bar-inner {
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 999px;
      animation: loadBar 2.4s ease forwards;
    }
    .splash-enter {
      padding: 10px 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.12);
      z-index: 1;
      transition: background 0.2s;
    }
    .splash-enter:active {
      background: rgba(255, 255, 255, 0.25);
    }
    .splash-footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      opacity: 0.7;
      z-index: 1;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes loadBar {
      0% { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">🏫</div>
    <div class="splash-title">福大失物招领</div>
    <div class="splash-subtitle">让每一件失物都能回家</div>
    <div class="splash-bar"><div class="bar-inner"></div></div>
    <button type="button" class="splash-enter" id="enterBtn">进入应用</button>
    <div class="splash-footer">福州大学 · 软件工程结对作业</div>
  </div>

  <script src="js/storage.js"></script>
  <script>
    // 启动时初始化示例数据，2.5 秒后自动进入首页
    Storage.initStorage();
    var timer = setTimeout(function () {
      location.href = 'index.html';
    }, 2500);
    document.getElementById('enterBtn').addEventListener('click', function () {
      clearTimeout(timer);
      location.href = 'index.html';
    });
  </script>
</body>
</html>
